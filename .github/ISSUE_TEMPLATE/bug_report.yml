name: Bug report
description: Report a defect in the SDK.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: SDK version or commit
    validations:
      required: true
  - type: input
    id: zig
    attributes:
      label: Zig version
      value: 0.16.0
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the exact commands and messages.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
  - type: textarea
    id: actual
    attributes:
      label: Actual result
