name: CI

on:
  push:
    # rewrite/** branches carry a candidate main head so its checks run before main moves.
    branches: [main, "rewrite/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-lint:
    name: fmt-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      - run: zig build fmt
      - run: zig build lint-docs -- --strict --string-literals
      - run: zig build census
      - run: zig build gen-bibliography
      - run: zig build gen-dictionary -- --check --out docs/generated/dictionary.md
      - run: zig build extract-requirements -- --check
      - run: zig build spec-matrix -- --check

  commit-policy:
    name: commit-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # On a pull request, check its head commits, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-zig
      - name: Check every commit of a pull request, or every reachable commit of a push
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            zig build commit-policy -- "origin/${{ github.base_ref }}..HEAD"
          else
            zig build commit-policy -- HEAD
          fi

  test:
    name: test (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
        optimize: [Debug, ReleaseSafe]
        include:
          - os: ubuntu-24.04
            optimize: ReleaseFast
          - os: ubuntu-24.04
            optimize: ReleaseSmall
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zig-global-cache
          key: zig-global-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
      - run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
      - run: zig build examples -Doptimize=${{ matrix.optimize }}

  cross:
    name: cross-compile
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [aarch64-linux-musl, x86_64-linux-musl, x86_64-windows-gnu, aarch64-macos]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      - run: zig build examples -Dtarget=${{ matrix.target }}

  consumer:
    name: consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      - run: zig build
        working-directory: examples/consumer
      - run: ./zig-out/bin/consumer --check
        working-directory: examples/consumer

  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      - run: zig build docs site
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: zig-out/site

  grpc-interop:
    name: grpc-interop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      - run: zig build conformance-server -Doptimize=ReleaseSafe
      - name: Start the everything server with gRPC
        run: |
          set -euo pipefail
          ./zig-out/bin/mcp-conformance-server --port 3000 --grpc-port 50051 > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 50); do
            if curl -s --max-time 2 -o /dev/null -X POST http://127.0.0.1:3000/mcp; then exit 0; fi
            sleep 0.2
          done
          echo "server did not start" >&2
          cat server.log >&2
          exit 1
      - name: Call the server from the Node http2 peer
        run: node .github/interop/h2_peer.mjs 50051
      - name: Call the server with curl over HTTP/2 prior knowledge
        run: |
          set -euo pipefail
          body='{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
          len=${#body}
          # JsonRpcMessage: field 1, length-delimited, then the gRPC length prefix.
          printf '\x0a' > message.bin
          printf "$(printf '\\x%02x' $((len & 0x7f | 0x80)) $((len >> 7)))" >> message.bin
          printf '%s' "$body" >> message.bin
          total=$(stat -c %s message.bin)
          { printf '\x00'; printf "$(printf '\\x%02x\\x%02x\\x%02x\\x%02x' $((total >> 24 & 255)) $((total >> 16 & 255)) $((total >> 8 & 255)) $((total & 255)))"; cat message.bin; } > call.bin
          status=$(curl -s --http2-prior-knowledge -o response.bin -w '%{http_code} %{content_type}' \
            -H 'content-type: application/grpc+proto' -H 'te: trailers' \
            -H 'mcp-protocol-version: 2026-07-28' -H 'mcp-method: server/discover' \
            --data-binary @call.bin http://127.0.0.1:50051/mcp.zig.transport.v1.Mcp/Call)
          echo "curl: $status"
          case "$status" in
            "200 application/grpc+proto") ;;
            *) echo "unexpected status" >&2; exit 1 ;;
          esac
          grep -q '"supportedVersions"' response.bin
      - name: Stop the everything server
        if: always()
        run: |
          kill "$(cat server.pid)" || true
          cat server.log || true

  conformance:
    name: conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      - run: zig build conformance-server -Doptimize=ReleaseSafe
      - name: Start the everything server
        run: |
          set -euo pipefail
          ./zig-out/bin/mcp-conformance-server --port 3000 > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 50); do
            if curl -s --max-time 2 -o /dev/null -X POST http://127.0.0.1:3000/mcp; then exit 0; fi
            sleep 0.2
          done
          echo "server did not start" >&2
          cat server.log >&2
          exit 1
      - name: Run the official conformance suite
        run: >
          npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.11 server
          --url http://127.0.0.1:3000/mcp
          --requirements 2026-07-28
          --expected-failures conformance/expected-failures-server.yml
          --output-dir conformance-results/server
      - name: Stop the everything server
        if: always()
        run: kill "$(cat server.pid)" || true
      - run: zig build conformance-client -Doptimize=ReleaseSafe
      - name: Run the official conformance suite against the client
        run: >
          npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.11 client
          --command ./zig-out/bin/mcp-conformance-client
          --requirements 2026-07-28
          --timeout 60000
          --expected-failures conformance/expected-failures-client.yml
          --output-dir conformance-results/client
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-results
          path: |
            conformance-results
            server.log
